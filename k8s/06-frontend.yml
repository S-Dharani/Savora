apiVersion: apps/v1
kind: Deployment
metadata:
  name: savora-frontend
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: savora-frontend
  template:
    metadata:
      labels:
        app: savora-frontend
    spec:
      containers:
        - name: frontend
          image: replace-with-your-dockerhub-username/savora-frontend:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: savora-frontend
  namespace: prod
spec:
  type: NodePort
  selector:
    app: savora-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
