# Replace all example values before deployment. Do not commit real production secrets.
apiVersion: v1
kind: Secret
metadata:
  name: savora-secrets
  namespace: prod
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: change-this-root-password
  MYSQL_PASSWORD: change-this-application-password
  JWT_SECRET: replace-with-a-long-random-secret-of-at-least-32-characters
