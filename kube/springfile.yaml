apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-app
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: springboot
  template:
    metadata:
      labels:
        app: springboot
    spec:
      containers:
        - name: springboot
          image: dharani1001/savorabackend
          ports:
            - containerPort: 8084
          env:
            - name: SPRING_URL
              value: jdbc:mysql://mysql-service:3306/savora?createDatabaseIfNotExist=true
            - name: MYSQL_USER
              value: root
            - name: MYSQL_PASSWORD
              value: root