spring:
  application.name: savora-api
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:savora}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    hibernate.ddl-auto: update
    open-in-view: false
    properties.hibernate.format_sql: true
  data.redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  cache.type: redis
server.servlet.context-path: /api
app.jwt.secret: ${JWT_SECRET:replace-this-development-secret-with-at-least-32-characters}
app.jwt.access-minutes: 30
app.jwt.refresh-days: 14
springdoc.swagger-ui.path: /swagger-ui.html
