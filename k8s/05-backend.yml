apiVersion: apps/v1
kind: Deployment
metadata:
  name: savora-backend
  namespace: prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: savora-backend
  template:
    metadata:
      labels:
        app: savora-backend
    spec:
      containers:
        - name: backend
          image: replace-with-your-dockerhub-username/savora-backend:latest
          ports:
            - containerPort: 8084
          env:
            - name: MYSQL_HOST
              value: mysql
            - name: MYSQL_PORT
              value: '3306'
            - name: MYSQL_DATABASE
              value: savora
            - name: MYSQL_USER
              value: savora
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: savora-secrets
                  key: MYSQL_PASSWORD
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: '6379'
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: savora-secrets
                  key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: savora-backend
  namespace: prod
spec:
  type: NodePort
  selector:
    app: savora-backend
  ports:
    - port: 8084
      targetPort: 8084
      nodePort: 30084
